name: .NET Build and Test

on:
  workflow_dispatch:
  push:
    branches-ignore:
      - release/*
      - release-pr/*
    paths:
      - '**.csproj'
      - '**.cs'
      - '**/Directory.Build.props'
      - 'version.json'
      - '.github/workflows/test.yaml'

env:
  DOTNET_VERSION: '10.0.x'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore dependencies
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore

      - name: Run tests
        run: dotnet test --no-build -- --retry-failed-tests 3 --report-trx --no-progress

      - name: Publish NativeAOT tests
        run: >
          dotnet publish tests/Configuration.Writable.Tests/Configuration.Writable.Tests.csproj
          --configuration Release
          --framework net10.0
          --runtime linux-x64
          --self-contained true

      - name: Run NativeAOT tests
        run: >
          tests/Configuration.Writable.Tests/bin/Release/net10.0/linux-x64/publish/Configuration.Writable.Tests
          --treenode-filter '/*/*/*/*JsonAot*'
          --no-progress
