name: .NET Build and Test (More Platforms)

on:
  workflow_call:
  workflow_dispatch:
  push:
    paths:
      - '**.csproj'
      - '**.cs'
      - '**/Directory.Build.props'
      - '**/Directory.Build.targets'
      - 'global.json'
      - '.github/workflows/test-strict.yaml'

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        tfm: [net10.0, net11.0]
    runs-on: ${{ matrix.os }}
    env:
      TFMS: ${{ matrix.tfm }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: |
            10.0.x
            11.0.x

      - name: Restore dependencies
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore

      - name: Run tests
        run: dotnet test --no-build -- --retry-failed-tests 3 --report-trx --no-progress

  native-aot:
    strategy:
      matrix:
        tfm: [net10.0, net11.0]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: |
            10.0.x
            11.0.x

      - name: Publish NativeAOT tests
        run: >
          dotnet publish tests/Configuration.Writable.Tests/Configuration.Writable.Tests.csproj
          --configuration Release
          --framework ${{ matrix.tfm }}
          --runtime linux-x64
          --self-contained true

      - name: Run NativeAOT tests
        run: >
          tests/Configuration.Writable.Tests/bin/Release/${{ matrix.tfm }}/linux-x64/publish/Configuration.Writable.Tests
          --treenode-filter '/*/*/*/*JsonAot*'
          --retry-failed-tests 3
          --report-trx
          --no-progress
